apiVersion: v1
kind: Namespace
metadata:
  name: khazna-images-ns
  labels:
    name: khazna-images-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: khazna-images
  namespace: khazna-images-ns
  labels:
    app: khazna-images
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: khazna-images
  template:
    metadata:
      labels:
        app: khazna-images
        version: v1
    spec:
      containers:
      - name: khazna-images
        image: khazna-images:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: image-storage
          mountPath: /tmp/images
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: image-storage
        emptyDir:
          sizeLimit: 1Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: khazna-images
  namespace: khazna-images-ns
  labels:
    app: khazna-images
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: khazna-images
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: khazna-images-hpa
  namespace: khazna-images-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: khazna-images
  minReplicas: 2
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: khazna-images-pdb
  namespace: khazna-images-ns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: khazna-images

