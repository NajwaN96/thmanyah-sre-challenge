apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thmanyah-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.thmanyah.local
    secretName: thmanyah-tls
  rules:
  - host: api.thmanyah.local
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: thmanyah-api
            port:
              number: 3000
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: musahha-auth
            port:
              number: 8080
      - path: /images
        pathType: Prefix
        backend:
          service:
            name: khazna-images
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: thmanyah-api
            port:
              number: 3000
---
# Cross-namespace services for ingress
apiVersion: v1
kind: Service
metadata:
  name: thmanyah-api
  namespace: default
spec:
  type: ExternalName
  externalName: thmanyah-api.thmanyah-api-ns.svc.cluster.local
  ports:
  - port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: musahha-auth
  namespace: default
spec:
  type: ExternalName
  externalName: musahha-auth.musahha-auth-ns.svc.cluster.local
  ports:
  - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: khazna-images
  namespace: default
spec:
  type: ExternalName
  externalName: khazna-images.khazna-images-ns.svc.cluster.local
  ports:
  - port: 5000

