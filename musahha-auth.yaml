apiVersion: v1
kind: Namespace
metadata:
  name: musahha-auth-ns
  labels:
    name: musahha-auth-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musahha-auth
  namespace: musahha-auth-ns
  labels:
    app: musahha-auth
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: musahha-auth
  template:
    metadata:
      labels:
        app: musahha-auth
        version: v1
    spec:
      containers:
      - name: musahha-auth
        image: musahha-auth:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: GIN_MODE
          value: "release"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: musahha-auth
  namespace: musahha-auth-ns
  labels:
    app: musahha-auth
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: musahha-auth
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: musahha-auth-hpa
  namespace: musahha-auth-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: musahha-auth
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: musahha-auth-pdb
  namespace: musahha-auth-ns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: musahha-auth

